name: CI/CD - API Automation

on:
  # Executes continuous integration after commits pushed to integration branches.
  push:
    branches: [main, develop]
  # Validates changes before they are merged into integration branches.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancels obsolete runs for the same branch or pull request.
concurrency:
  group: api-automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate - TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each job is isolated and must retrieve the repository source.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Restores npm's package cache using package-lock.json as the cache key.
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stops the pipeline when TypeScript compilation identifies an error.
      - name: Run TypeScript type check
        run: npm run typecheck

  api-tests:
    name: API Tests - Playwright
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This job uses a clean runner to keep test execution reproducible.
      - name: Checkout source code
        uses: actions/checkout@v4

      # Restores npm's package cache using package-lock.json as the cache key.
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Installs Playwright runtime dependencies explicitly for version-aligned execution.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Runs the Playwright API suite and generates the configured HTML report.
      - name: Run Playwright API tests
        run: npm test

      # Transfers results to the publishing job even when test assertions fail.
      - name: Preserve generated test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1

  publish-test-results:
    name: Publish Test Results
    needs: api-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Retrieves the report and failure artifacts generated by the test job.
      - name: Download generated test artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-test-artifacts
          path: artifacts

      # Publishes the HTML report as a separately downloadable workflow artifact.
      - name: Publish Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/playwright-report/
          if-no-files-found: warn
          retention-days: 30

      # Publishes traces, screenshots, and error context generated on failures.
      - name: Publish Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30
